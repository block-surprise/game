<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

h1{
    margin:10px 0;
}

canvas{
    background:black;
    border:2px solid #666;
    width:min(95vw,360px);
    height:auto;
}

.controls{
    width:min(95vw,360px);
    margin:10px auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

button{
    font-size:22px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
}

button:active{
    transform:scale(0.95);
}

.wide{
    grid-column:span 2;
}
</style>
</head>

<body>

<h1>TETRIS</h1>

<canvas id="game" width="300" height="600"></canvas>

<div class="controls">
    <button onclick="move(-1)">⬅️</button>
    <button onclick="rotatePiece()">🔄</button>
    <button onclick="move(1)">➡️</button>
    <button onclick="softDrop()">⬇️</button>

    <button class="wide" onclick="hardDrop()">⤓ ハードドロップ</button>
    <button class="wide" onclick="rotatePiece()">回転</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const SIZE = 30;

const COLORS = [
 null,
 "#00FFFF",
 "#0000FF",
 "#FF8800",
 "#FFFF00",
 "#00FF00",
 "#AA00FF",
 "#FF0000"
];

const PIECES = [
 [],
 [[1,1,1,1]],

 [[2,0,0],
  [2,2,2]],

 [[0,0,3],
  [3,3,3]],

 [[4,4],
  [4,4]],

 [[0,5,5],
  [5,5,0]],

 [[0,6,0],
  [6,6,6]],

 [[7,7,0],
  [0,7,7]]
];

let board =
Array.from({length:ROWS},
()=>Array(COLS).fill(0));

function newPiece(){
    const id =
    Math.floor(Math.random()*7)+1;

    return{
        x:3,
        y:0,
        shape:PIECES[id].map(r=>[...r])
    };
}

let piece = newPiece();

function drawCell(x,y,color){
    ctx.fillStyle=COLORS[color];
    ctx.fillRect(
        x*SIZE,
        y*SIZE,
        SIZE,
        SIZE
    );

    ctx.strokeStyle="#222";
    ctx.strokeRect(
        x*SIZE,
        y*SIZE,
        SIZE,
        SIZE
    );
}

function draw(){

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    for(let y=0;y<ROWS;y++){
        for(let x=0;x<COLS;x++){

            if(board[y][x]){
                drawCell(
                    x,
                    y,
                    board[y][x]
                );
            }
        }
    }

    piece.shape.forEach((row,y)=>{
        row.forEach((value,x)=>{

            if(value){
                drawCell(
                    piece.x+x,
                    piece.y+y,
                    value
                );
            }
        });
    });
}

function collide(
    nx=piece.x,
    ny=piece.y,
    shape=piece.shape
){

    for(let y=0;y<shape.length;y++){

        for(let x=0;x<shape[y].length;x++){

            if(!shape[y][x]) continue;

            const px=nx+x;
            const py=ny+y;

            if(
                px<0 ||
                px>=COLS ||
                py>=ROWS
            ){
                return true;
            }

            if(
                py>=0 &&
                board[py][px]
            ){
                return true;
            }
        }
    }

    return false;
}

function merge(){

    piece.shape.forEach((row,y)=>{
        row.forEach((value,x)=>{

            if(value){
                board[piece.y+y]
                [piece.x+x]=value;
            }

        });
    });

    clearLines();

    piece=newPiece();

    if(collide()){

        alert("GAME OVER");

        board=
        Array.from(
            {length:ROWS},
            ()=>Array(COLS).fill(0)
        );
    }
}

function clearLines(){

    for(
        let y=ROWS-1;
        y>=0;
        y--
    ){

        if(
            board[y].every(
                v=>v!==0
            )
        ){

            board.splice(y,1);

            board.unshift(
                Array(COLS).fill(0)
            );

            y++;
        }
    }
}

function move(dir){

    if(
        !collide(
            piece.x+dir,
            piece.y
        )
    ){
        piece.x+=dir;
    }

    draw();
}

function rotatePiece(){

    const rotated =
    piece.shape[0].map(
        (_,i)=>
        piece.shape
        .map(row=>row[i])
        .reverse()
    );

    if(
        !collide(
            piece.x,
            piece.y,
            rotated
        )
    ){
        piece.shape=rotated;
    }

    draw();
}

function softDrop(){
    update();
}

function hardDrop(){

    while(
        !collide(
            piece.x,
            piece.y+1
        )
    ){
        piece.y++;
    }

    merge();
    draw();
}

function update(){

    if(
        !collide(
            piece.x,
            piece.y+1
        )
    ){
        piece.y++;
    }
    else{
        merge();
    }

    draw();
}

document.addEventListener(
"keydown",
e=>{

    if(e.key==="ArrowLeft")
        move(-1);

    if(e.key==="ArrowRight")
        move(1);

    if(e.key==="ArrowDown")
        softDrop();

    if(e.key==="ArrowUp")
        rotatePiece();

    if(e.code==="Space")
        hardDrop();
});

setInterval(update,500);

draw();
</script>

</body>
</html>
